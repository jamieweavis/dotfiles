# Start tabs from 1 instead of 0 for easier navigation
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse for scroll
setw -g mouse on

# Display the status bar at the top of the terminal
set -g status-position top

# Renumber windows sequentially when closed
set -g renumber-windows on

# Status bar styling
set -g status-left-length 100
set -g status-style "fg=white,bg=default"
set -g window-status-format "#[fg=white,bg=default] #I:#W #[fg=default,bg=default]"
set -g window-status-current-format "#[fg=black,bg=green] #I:#W #[fg=green,bg=black]"
set -g status-left "#[fg=yellow,bg=default]#{?client_prefix,*, } "
set -g status-right "#[fg=yellow,bg=default]#S  "

# Ctrl+Space for prefix
set -g prefix C-space
unbind-key C-b
bind-key C-space send-prefix

# Open splits in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Navigate between panes using vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split pane border colors
set -g pane-active-border-style bg=default,fg=brightblack
set -g pane-border-style fg=black
